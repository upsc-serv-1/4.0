<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noji Analytics Design System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .stacked-bar { height: 10px; border-radius: 5px; overflow: hidden; display: flex; }
        .segment-correct { background-color: #10b981; }
        .segment-incorrect { background-color: #ef4444; }
        .segment-skipped { background-color: #94a3b8; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-900 text-slate-900 mb-8">Analytics Design System</h1>

        <!-- Colors -->
        <section class="mb-12">
            <h2 class="text-xl font-800 text-slate-700 mb-4 uppercase tracking-wider">Semantic Colors</h2>
            <div class="grid grid-cols-4 gap-4">
                <div class="p-4 rounded-2xl bg-indigo-600 text-white font-bold">Primary (Indigo)</div>
                <div class="p-4 rounded-2xl bg-emerald-500 text-white font-bold">Success (Correct)</div>
                <div class="p-4 rounded-2xl bg-rose-500 text-white font-bold">Error (Incorrect)</div>
                <div class="p-4 rounded-2xl bg-slate-400 text-white font-bold">Neutral (Skipped)</div>
            </div>
        </section>

        <!-- Components -->
        <section class="mb-12">
            <h2 class="text-xl font-800 text-slate-700 mb-4 uppercase tracking-wider">Core Components</h2>
            
            <div class="space-y-6">
                <!-- Stacked Status Bar -->
                <div class="glass p-6 rounded-3xl">
                    <h3 class="text-sm font-800 text-slate-500 mb-3 uppercase">Stacked Status Bar (The Meter)</h3>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-700 text-slate-700">Modern History</span>
                        <span class="text-xs font-900 text-slate-500">8 / 14 Questions</span>
                    </div>
                    <div class="stacked-bar">
                        <div style="width: 60%" class="segment-correct"></div>
                        <div style="width: 30%" class="segment-incorrect"></div>
                        <div style="width: 10%" class="segment-skipped"></div>
                    </div>
                    <div class="flex gap-4 mt-3">
                        <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-emerald-500"></div><span class="text-[10px] font-bold text-slate-500">8 Correct</span></div>
                        <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-rose-500"></div><span class="text-[10px] font-bold text-slate-500">4 Incorrect</span></div>
                        <div class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-slate-400"></div><span class="text-[10px] font-bold text-slate-500">2 Skipped</span></div>
                    </div>
                </div>

                <!-- Hierarchical Row -->
                <div class="glass p-4 rounded-2xl flex items-center justify-between hover:bg-white transition-colors cursor-pointer border-l-4 border-indigo-500">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-indigo-100 flex items-center justify-center">
                            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        </div>
                        <div>
                            <p class="text-sm font-900 text-slate-800">History</p>
                            <p class="text-[10px] font-700 text-slate-400 uppercase tracking-tighter">78% Accuracy • 42 Qs</p>
                        </div>
                    </div>
                    <div class="w-32">
                        <div class="stacked-bar">
                            <div style="width: 78%" class="segment-correct"></div>
                            <div style="width: 15%" class="segment-incorrect"></div>
                            <div style="width: 7%" class="segment-skipped"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
