<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Analytics Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .stacked-bar { height: 8px; border-radius: 4px; overflow: hidden; display: flex; }
        .segment-correct { background-color: #10b981; }
        .segment-incorrect { background-color: #ef4444; }
        .segment-skipped { background-color: #94a3b8; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative overflow-hidden">
        <!-- Header -->
        <header class="p-6 pb-2 bg-white border-b sticky top-0 z-20">
            <div class="flex items-center gap-4 mb-4">
                <button class="p-2 rounded-xl bg-slate-100"><svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                <h1 class="text-xl font-900 text-slate-900">Analysis Report</h1>
            </div>
            <!-- Tabs -->
            <div class="flex gap-2 p-1 bg-slate-100 rounded-2xl">
                <button class="flex-1 py-2 rounded-xl text-sm font-800 text-slate-400">Review</button>
                <button class="flex-1 py-2 rounded-xl text-sm font-900 bg-white shadow-sm text-indigo-600">Analysis</button>
            </div>
        </header>

        <main class="p-6 space-y-8">
            <!-- Overall Summary -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-800 text-slate-500 uppercase tracking-widest">Subject Breakdown</h2>
                </div>
                
                <div class="space-y-4">
                    <!-- Subject Card: History -->
                    <div class="glass p-5 rounded-3xl card-shadow border-l-4 border-emerald-500">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-900 text-slate-800">History</h3>
                                <p class="text-[10px] font-700 text-slate-400 uppercase tracking-wider">High Accuracy Area</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xl font-900 text-emerald-600">82%</span>
                                <p class="text-[10px] font-800 text-slate-400">14/17 Correct</p>
                            </div>
                        </div>
                        
                        <!-- Stacked Meter -->
                        <div class="stacked-bar mb-3">
                            <div style="width: 82%" class="segment-correct"></div>
                            <div style="width: 12%" class="segment-incorrect"></div>
                            <div style="width: 6%" class="segment-skipped"></div>
                        </div>

                        <!-- Section Groups (Themes) Expansion -->
                        <div class="mt-6 border-t pt-4 space-y-4">
                            <!-- Section Group: Modern History -->
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-xs font-800 text-slate-600">Modern History</span>
                                    <span class="text-[10px] font-900 text-slate-400 italic">5 Correct • 2 Missed</span>
                                </div>
                                <div class="stacked-bar">
                                    <div style="width: 71%" class="segment-correct"></div>
                                    <div style="width: 29%" class="segment-incorrect"></div>
                                </div>
                                <!-- Microtopic Detail (Leaf) -->
                                <div class="mt-2 pl-4 border-l-2 border-slate-100 space-y-2">
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] font-700 text-slate-500">1857 Revolt</span>
                                        <div class="flex gap-1">
                                            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                                            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                                            <div class="w-1.5 h-1.5 rounded-full bg-rose-500"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Section Group: Medieval History -->
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-xs font-800 text-slate-600">Medieval History</span>
                                    <span class="text-[10px] font-900 text-slate-400 italic">100% Perfect</span>
                                </div>
                                <div class="stacked-bar">
                                    <div style="width: 100%" class="segment-correct"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Subject Card: Polity -->
                    <div class="glass p-5 rounded-3xl card-shadow border-l-4 border-rose-500 bg-rose-50/20">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-900 text-slate-800">Polity</h3>
                                <p class="text-[10px] font-700 text-rose-400 uppercase tracking-wider">Critical Review Needed</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xl font-900 text-rose-600">45%</span>
                                <p class="text-[10px] font-800 text-slate-400">9/20 Correct</p>
                            </div>
                        </div>
                        
                        <div class="stacked-bar">
                            <div style="width: 45%" class="segment-correct"></div>
                            <div style="width: 45%" class="segment-incorrect"></div>
                            <div style="width: 10%" class="segment-skipped"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Bottom Floating Action -->
            <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full px-6">
                <button class="w-full py-4 bg-indigo-600 rounded-2xl shadow-xl text-white font-900 text-sm flex items-center justify-center gap-3 active:scale-95 transition-transform">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                    START REVISION (11 MISTAKES)
                </button>
            </div>
        </main>
    </div>
</body>
</html>
